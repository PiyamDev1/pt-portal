name: Deploy Ticketing capability 2026083101

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ticketing-2026083101
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ckubfbjfjbhuotyfwmac

jobs:
  migrate:
    name: Apply package quotation Ticketing prices
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate Supabase CLI
        run: npx --yes supabase@latest login --token "${{ secrets.SUPABASE_ACCESS_TOKEN }}"

      - name: Link production project
        run: |
          npx --yes supabase@latest link --project-ref "$SUPABASE_PROJECT_REF" \
            --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Stage the audited migration
        run: |
          mkdir -p supabase/migrations
          cp scripts/migrations/20260831_ticketing_unpriced_held_quick_entry.sql \
            supabase/migrations/20260831001000_ticketing_unpriced_held_quick_entry.sql

      - name: Apply capability 2026083101
        run: npx --yes supabase@latest db push --linked --yes
