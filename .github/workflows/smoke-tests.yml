name: Smoke Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
      SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
      SMOKE_USER_BRANCH_CODE: ${{ secrets.SMOKE_USER_BRANCH_CODE }}
      SMOKE_FAMILY_HEAD_ID: ${{ secrets.SMOKE_FAMILY_HEAD_ID }}
      SMOKE_2FA_BACKUP_CODE: ${{ secrets.SMOKE_2FA_BACKUP_CODE }}
      SMOKE_2FA_TOTP_SECRET: ${{ secrets.SMOKE_2FA_TOTP_SECRET }}
      SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
      PLAYWRIGHT_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
      SMOKE_LMS_ACCOUNT_ID: ${{ secrets.SMOKE_LMS_ACCOUNT_ID }}
      SMOKE_PACKAGE_SHARE_TOKEN: ${{ secrets.SMOKE_PACKAGE_SHARE_TOKEN }}
      SMOKE_RUN_BATCH: ${{ secrets.SMOKE_RUN_BATCH }}
      SMOKE_RECEIPT_NADRA_ID: ${{ secrets.SMOKE_RECEIPT_NADRA_ID }}
      SMOKE_RUN_RECEIPT_MUTATION: ${{ secrets.SMOKE_RUN_RECEIPT_MUTATION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate required smoke secrets
        run: |
          missing=0
          for v in SMOKE_USER_EMAIL SMOKE_USER_PASSWORD SMOKE_USER_BRANCH_CODE SMOKE_FAMILY_HEAD_ID SMOKE_BASE_URL; do
            if [ -z "${!v}" ]; then
              echo "Missing $v"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "Smoke test configuration is incomplete. Configure every required repository secret."
            exit 1
          fi

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
