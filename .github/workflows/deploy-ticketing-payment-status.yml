name: Deploy direct Ticketing payment status updates

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260925184500_ticketing_direct_payment_status.sql'
      - '.github/workflows/deploy-ticketing-payment-status.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ticketing-payment-status
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ckubfbjfjbhuotyfwmac

jobs:
  migrate:
    name: Apply direct Ticketing payment update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate Supabase CLI
        run: npx --yes supabase@latest login --token "${{ secrets.SUPABASE_ACCESS_TOKEN }}"

      - name: Stage only the reviewed migration
        run: |
          mkdir -p .ticketing-payment-stage
          mv supabase/migrations .ticketing-payment-stage/all-migrations
          mkdir -p supabase/migrations
          for version in \
            20260831000800 \
            20260831000801 \
            20260831000900 \
            20260831001000 \
            20260831001100 \
            20260831001200 \
            20260831001300 \
            20260902000100 \
            20260902000200 \
            20260908214024 \
            20260925184500; do
            cp .ticketing-payment-stage/all-migrations/"${version}"_*.sql supabase/migrations/
          done

      - name: Link production project through the supported pooler
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx --yes supabase@latest link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply only the reviewed migration
        run: npx --yes supabase@latest db push --linked --yes
